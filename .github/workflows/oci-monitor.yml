name: OCI Free Tier Monitor

# Oracle Cloud 免费层(A1)容量监控与自动开通 —— 个人运维自动化。
# 运行方式：GitHub schedule 每 6 小时触发一次（UTC 00/06/12/18 = 北京 08/14/20/02），
# 每次运行最长 5.5 小时（低于单 job 6 小时上限，留缓冲），符合 Actions 常规用法。
# 手动触发（workflow_dispatch）用于测试与补跑错过的时段。
# 状态通过 actions/cache 跨运行传递；日报（北京时间 02:00）由运行中的实例发出。

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "本次运行的探测轮数"
        required: false
        default: "9999"
      max_minutes:
        description: "本次运行最长时长（分钟），到点自动结束"
        required: false
        default: "330"
      dry_run:
        description: "只查询不创建不推送（true/false）"
        required: false
        default: "false"

concurrency:
  group: oci-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install --quiet oci requests

      # 跨 run 的「今日累计」状态（cache 按天滚动）
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .grab_state
          key: oci-monitor-state-${{ github.run_id }}
          restore-keys: |
            oci-monitor-state-

      - name: Monitor & provision
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUB_KEY: ${{ secrets.SSH_PUB_KEY }}
          GRAB_STATE_DIR: .grab_state
          # 只读本仓库运行记录（体检信息并入日报）。内置 token 即可，无需 PAT。
          GH_PAT: ${{ github.token }}
          # VPS 保活看门狗：判断 free-vm 保活进程是否在跑，不跑则远程补触发。
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ROUNDS=9999
            MAXMIN=330
            EXTRA=""
          else
            ROUNDS="${{ github.event.inputs.rounds || '9999' }}"
            MAXMIN="${{ github.event.inputs.max_minutes || '330' }}"
            EXTRA="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          fi
          echo "rounds=$ROUNDS max_minutes=$MAXMIN extra=$EXTRA"
          python scripts/oci_monitor.py --rounds "$ROUNDS" --max-seconds $((MAXMIN * 60)) $EXTRA

      # 失败也把状态抛出来，方便在 Actions 页面直接看
      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}
          path: .grab_state/
          if-no-files-found: ignore
          retention-days: 3
